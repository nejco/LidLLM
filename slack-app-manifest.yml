# Slack app manifest for LidLLM alerts.
# api.slack.com/apps → Create New App → From a manifest → pick your workspace → paste this.
# Then: Install to Workspace → choose the channel for alerts → copy the webhook URL
# (Features → Incoming Webhooks) into LidLLM → "Set up Slack alerts…".
display_information:
  name: LidLLM
  description: Alerts when your Mac running AI agents gets too hot or is put to sleep.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: LidLLM
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
