name: Build

# Builds LidLLM.dmg and attaches it to the release when a GitHub release is published.
on:
  release:
    types: [published]

permissions:
  contents: write # needed to upload the DMG to the release

jobs:
  build:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build LidLLM.app
        run: ./build.sh

      - name: Package DMG
        run: |
          # Disk image with the app and an Applications shortcut to drag it onto
          mkdir dmg
          cp -R LidLLM.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname LidLLM -srcfolder dmg -fs HFS+ -format UDZO -ov LidLLM.dmg
          shasum -a 256 LidLLM.dmg

      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" LidLLM.dmg --clobber
